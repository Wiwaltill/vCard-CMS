name: Vendor update check

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'public/includes/vendor/packages.json'
      - 'scripts/check_vendor_updates.py'
      - '.github/workflows/vendor-updates.yml'

permissions:
  contents: read

concurrency:
  group: vendor-update-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check latest stable vendor releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_vendor_updates.py
